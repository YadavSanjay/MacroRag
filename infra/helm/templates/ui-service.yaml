apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-macro-rag-ui
  labels: { app: macro-rag-ui }
spec:
  type: {{ .Values.ui.service.type }}
  selector: { app: macro-rag-ui }
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.port }}
      protocol: TCP
