<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1050" width="1040" height="1050" role="img" aria-labelledby="t d">
<title id="t">MacroRAG architecture</title>
<desc id="d">Free public macro sources (Fed and Treasury, US statistics, international bodies, house views, power and chips) feed nine tiers of ingest handlers that write dated, licence-tagged documents to a local-or-S3 object store. The index builds a Qdrant hybrid index for prose and a SQLite time-series store for exact numbers, stamped with a content-addressed world_view_id. Retrieval analyses the question, runs hybrid search with RRF fusion, reranks against a relevance floor, ranks and diversifies, and hydrates exact series. Two outputs follow: a faithfulness-checked cited answer, and a shock vector that passes a deterministic gate ladder (vocabulary, citation gate, validation, diagnostics) before it reaches the faultline stress engine. Everything is served over REST, MCP, a CLI and a React UI, with evaluation and a provenance spine alongside.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
