; MacroRAG type-checking config.
;
; Philosophy: mypy earns its place only if a run that reports errors means
; something is actually wrong. Run bare, it reports ~77 issues that are almost
; all third-party shape noise, which trains everyone to ignore it. This config
; silences the noise **at its source module** so that what remains is signal.
;
;   conda run -n py312 mypy src/
;
; Two rules for editing this file:
;   1. Suppressions are per-module and per-error-code, never global. A blanket
;      `ignore_errors` on our own code would hide real defects.
;   2. Every override says WHY. If the reason stops being true (a library ships
;      stubs, a lazy import becomes a hard dependency), delete the override.

[mypy]
python_version = 3.12
; `src` is the import root — packages are imported as `utils`, `ingest`, … not
; `src.*` — so mypy needs the same path the runtime uses (see CLAUDE.md).
mypy_path = src
explicit_package_bases = True
namespace_packages = True

; The codebase is pydantic-heavy (RagSettings, all API models). The plugin
; teaches mypy about BaseModel __init__ signatures, Field defaults and aliases;
; without it, ordinary pydantic idioms are reported as errors.
plugins = pydantic.mypy

show_error_codes = True
; Keep the suppression list honest: if an override stops being needed, say so
; instead of letting it rot.
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True
; Coding standards: a `# type: ignore` must be needed and must name its error code.
warn_unused_ignores = True
enable_error_code = ignore-without-code

; Deliberately NOT enabled (yet): disallow_untyped_defs, check_untyped_defs,
; strict_optional escalation. The codebase is annotated at its seams rather than
; exhaustively, so turning these on now would bury real findings under hundreds
; of style reports. Tighten module-by-module once the baseline is green.

[pydantic-mypy]
init_typed = True
warn_required_dynamic_aliases = True


; ─────────────────────────────────────────────────────────────────────────────
; Third-party libraries with no bundled type information.
;
; These ship no py.typed marker and have no stubs installed. Installing
; types-PyYAML / types-python-dateutil / types-jsonschema / types-openpyxl would
; give real checking of those call sites and is a strict improvement — but they
; are dev-only dependencies and requirements.txt feeds the runtime container, so
; they are not added here. Revisit if a requirements-dev.txt appears.
; ─────────────────────────────────────────────────────────────────────────────

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-dateutil.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-xlrd.*]
ignore_missing_imports = True

[mypy-feedparser.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
ignore_missing_imports = True

[mypy-fastmcp.*]
ignore_missing_imports = True

; Heavy model deps — never installed in the lightweight backend image, and only
; imported when retrieval falls back to in-process models (CLAUDE.md, inference).
[mypy-FlagEmbedding.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-mcp.*]
ignore_missing_imports = True

; Optional at runtime, by design: redis is lazy-imported behind the
; `backend: memory|redis` toggles and boto3 behind `deploy_mode: aws`, so a
; local install legitimately does not have them (CLAUDE.md, Deploy mode).
[mypy-redis.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True


; ─────────────────────────────────────────────────────────────────────────────
; Our own modules that sit directly on an untyped or union-heavy library
; boundary. Suppression is limited to the specific codes the boundary produces,
; so ordinary bugs in these files are still reported.
; ─────────────────────────────────────────────────────────────────────────────

; BeautifulSoup models every node as `PageElement | Tag | NavigableString`, so
; every `.find_all` / `node["href"]` on a correctly-narrowed element is reported.
; The parsers guard structurally (and are covered by ingest tests); annotating
; around bs4's unions would add casts without adding safety.
[mypy-ingest.common.html_extract]
disable_error_code = union-attr, index, attr-defined, arg-type

[mypy-ingest.common.dateextract]
disable_error_code = union-attr, index, attr-defined, arg-type

[mypy-ingest.common.feeds]
; `datetime(*struct[:6], tzinfo=...)` — mypy cannot see that the slice caps the
; positional count at 6, so it thinks tzinfo may be passed twice. The call is
; also wrapped in try/except TypeError.
disable_error_code = misc

[mypy-ingest.common.spreadsheet]
disable_error_code = union-attr, index, attr-defined, arg-type

; The boto3 client is intentionally held as `object` so `boto3` is never imported
; in local mode (it is not a hard dependency). That makes every S3 call an
; attr-defined error by construction — the price of the lazy-import seam.
[mypy-utils.objectstore]
disable_error_code = attr-defined

; qdrant_client's request models take tightly-typed enums/unions where the store
; passes through already-validated strings and payload values from MetaFilter.
[mypy-vectorstores.qdrant_store]
disable_error_code = arg-type

; Runners are injected as `Callable[[Job], object]` and the cost guard as
; `object` (it is one of two duck-typed implementations), so the call sites read
; as untyped-attribute access.
[mypy-api.app]
disable_error_code = union-attr, arg-type
