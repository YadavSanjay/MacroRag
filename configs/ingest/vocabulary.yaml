# ─────────────────────────────────────────────────────────────────────────────
# Macro RAG — controlled vocabulary registry (cross-tier)
#
# Single source of truth for the metadata facets used as Qdrant payload filters.
# `factor_tags` and `entity_tags` are authored in the per-tier endpoint catalogs;
# `doc_type` is emitted by handlers / doc_type_rules. Keeping them closed here
# means a query filter (e.g. factor_tags=credit_spread, entity_tags=ai) catches
# every tier instead of missing a synonym or a casing variant.
#
# Convention: all tags are lower_snake_case. Add a new term here FIRST, then use
# it in a tier config — config load warns on any tag absent from this registry.
# `aliases` maps a legacy/variant term to its canonical form; both the config
# loader and the data-migration apply it so old references self-heal.
# ─────────────────────────────────────────────────────────────────────────────

# ── Factor tags — macro shock channels (the primary analytical filter) ────────
factor_tags:
  # rates / monetary
  - discount_rate              # policy rate level
  - term_premium               # long-end term premium
  - rates_vol                  # rate volatility
  - forward_guidance           # central-bank communication / stance signalling
  - monetary_policy            # broad non-US monetary stance (e.g. BoJ)
  # credit / funding
  - credit_spread              # market-priced credit risk
  - credit_conditions          # survey-based lending conditions (SLOOS)
  - usd_funding                # USD funding / cross-currency basis
  - foreign_demand             # foreign demand for USD assets (TIC)
  # growth / inflation / fiscal / fx
  - growth
  - inflation
  - labor
  - fiscal
  - fx
  - systemic                   # systemic financial-stability risk
  # equity / valuation
  - equity_vol
  - valuation_stretch
  - hyperscaler_concentration  # mega-cap / hyperscaler concentration risk
  # AI buildout — demand & spend
  - ai_capex                   # AI infrastructure spend (incl. AI investment)
  - ai_adoption                # AI diffusion / firm-level adoption
  - ai_productivity_risk       # productivity-disappointment risk
  # AI buildout — power / physical constraint
  - data_center_power          # data-center power availability as a constraint
  - electricity_demand         # grid load growth (demand side)
  - interconnection_constraint # grid interconnection-queue bottleneck
  # semis / supply chain / geopolitics
  - semi_sales                 # semiconductor billings (SIA)
  - foundry_demand             # foundry utilization (TSMC)
  - export_controls            # chip / tech export-control regime
  - china_taiwan_tail          # Taiwan-conflict tail risk
  - geopolitical_risk          # GPR index family
  - policy_uncertainty         # EPU index family
  # cross-asset scenario / stress (Tier 7 — quantified shock studies)
  - cross_asset_scenario       # study mapping an event to joint asset moves
  - stress_scenario            # regulator / official adverse stress scenario
  - supply_chain_disruption    # trade / semiconductor supply-chain disruption
  - sanctions_regime           # sanctions / financial-flow restriction scenario
  - flight_to_quality          # safe-haven / risk-off flow (rally, not sell-off)

# ── Entity tags — themes / actors (secondary filter) ──────────────────────────
entity_tags:
  - ai
  - china
  - data_center
  - hyperscaler
  - semiconductors
  - quantum

# ── Aliases — legacy/variant -> canonical (applied at load + in migration) ────
aliases:
  # casing normalisation
  AI: ai
  China: china
  # synonym merges
  ai_investment: ai_capex            # AI investment == AI capex
  power_constraint: data_center_power # same power-availability channel
  # faultline scenario-synthesis facet tokens -> MacroRAG canonical entity tags
  # (the corpus tags Taiwan-tail risk under `china` + the `china_taiwan_tail`
  # factor; TSMC/Nvidia are tagged at the `semiconductors` theme level).
  hyperscalers: hyperscaler
  tsmc: semiconductors
  nvidia: semiconductors
  taiwan: china

# ── Document types — per-source identifiers (validated, not merged) ───────────
